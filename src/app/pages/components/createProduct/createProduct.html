<section>
  <button class="open-modal-button" type="button" (click)="openModal()">
    Nuevo producto
  </button>

  <div class="modal-backdrop" [class.open]="isOpen" role="dialog" aria-modal="true" [attr.aria-hidden]="!isOpen">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>Registrar producto</h2>
        <button class="close-button" type="button" aria-label="Cerrar modal" (click)="closeModal()">×</button>
      </div>

      <form (submit)="registerProduct($event)">
        <div class="modal-body">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" placeholder="Ej. Zapatillas deportivas" required />

          <label for="price">Precio</label>
          <input id="price" name="price" type="number" min="0" step="0.01" placeholder="Ej. 4999.99" required />

          <label for="category">Categoría</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>Elegí una categoría</option>
            <option value="Ropa">Ropa</option>
            <option value="Electrónica">Electrónica</option>
            <option value="Calzado">Calzado</option>
            <option value="Accesorios">Accesorios</option>
          </select>

          <label for="stock">Stock</label>
          <input id="stock" name="stock" type="number" min="0" placeholder="Ej. 20" />

          <label for="imageUrl">URL de imagen</label>
          <input id="imageUrl" name="imageUrl" type="url" placeholder="https://..." />

          <label for="description">Descripción</label>
          <textarea id="description" name="description" placeholder="Descripción del producto"></textarea>
        </div>

        <div class="modal-actions">
          <button class="button-secondary" type="button" (click)="closeModal()">Cancelar</button>
          <button class="button-primary" type="submit">Registrar producto</button>
        </div>
      </form>

      <p class="form-note">Los campos Nombre, Precio y Categoría son obligatorios.</p>
    </div>
  </div>
</section>
